{% load static %}

<header class="navbar">
    <div class="logo">
       <img
    src="{% static 'content/logo.png' %}"
    alt="Logo">
    </div>

    <nav>
        <ul>
            <li><a href="{% url 'frontpage:index' %}">Головна</a></li>
            <li><a href="{% url 'frontpage:about' %}">Про проєкт</a></li>

            {% if user.is_authenticated and user.is_staff %}
            <li><a href="{% url 'admin:index' %}">Адміністрування</a></li>
            {% endif %}
            {% if user.is_authenticated %} 
            <li><a href="{% url 'users:home' %}">Студенту</a></li>

            <li>
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit">Вийти з профіля</button>
                </form> 
                </li>
                {% else %}<a href="{% url 'login' %}">Увійти</a>
                
                {% endif %}
        </ul>
    </nav>
</header>
